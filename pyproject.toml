[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-agent"
version = "0.1.0"
description = "A Gemini-powered research-brief agent with built-in governance: typed output, budget cap, egress allowlist, and per-call trace."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mukunda Katta" }]
keywords = ["gemini", "vertex-ai", "agent", "google-cloud", "governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.7"]
vertex = ["google-genai>=1.0"]
phoenix = [
    "arize-phoenix>=4.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/rapid-agent"
Repository = "https://github.com/MukundaKatta/rapid-agent"
Issues = "https://github.com/MukundaKatta/rapid-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
